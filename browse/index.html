<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> WAICAM </title>

        <link rel="stylesheet" type="text/css" href="/styles.css">
        <script src="/js/common.js"></script>
    </head>
    <body>
        <div class="bar titlebar">
            <div class="horizpadding"></div>
            <div class="leftalign">
                <span class="barentry waicam"> WAICAM </span>
            </div>
            <div class="rightalign">
                <a class="barbutton barentry" href="/">Home</a>
                <a class="barbutton barentry disabledentry">Browse works</a>
                <a class="barbutton barentry" href="/by-region/">By region</a>
            </div>
            <div class="horizpadding"></div>
            <div class="horizpadding"></div>
        </div>
        <div id="main">
            <div id="content">
                <h1> Browse all Works </h1>
                <span>
                    Sort alphabetical by:
                </span>
                <select name="sortworks" id="sortworks" autocomplete="off">
                    <option value="by-museum" selected> Museum </option>
                    <option value="by-title"> Title of Work </option>
                    <option value="by-artist"> Artist </option>
                </select>
                <br>
                <br>
                <div id="allWorks">
                </div>
            </div>
            <script src="/js/browse.js"></script>
        </div>
        <div class="bar footerbar">
            <div class="leftalign">
            </div>
            <div class="rightalign">
                <a class="barlink barentry">Contact us</a>
            </div>
            <div class="horizpadding"></div>
            <div class="horizpadding"></div>
        </div>
    </body>
</html>
